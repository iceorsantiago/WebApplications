<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contact</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <h1>Contact Form</h1>
    <nav>
      <a href="../index.html">Home</a> |
      <a href="courses.html">Courses</a> |
      <a href="schedule.html">Schedule</a> |
      <a class="active" href="contact.html">Contact</a> |
      <a href="hobbies.html">Hobbies</a>
    </nav>
  </header>

  <main>
    <form action="#" method="post">
      <div class="form-group">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" value="Santiago Aispur" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">
      </div>

      <div class="form-group">
        <label for="degree">Degree Program:</label>
        <input type="text" id="degree" name="degree" value="Computer Science">
      </div>

      <div class="form-group">
        <label for="semester">Semester:</label>
        <input type="number" id="semester" name="semester" value="7" min="1" max="10">
      </div>

      <div class="form-group">
        <label for="reason">Reason for Contact:</label>
        <select id="reason" name="reason">
          <option value="cs-club">CS Club Collaboration</option>
          <option value="academic">Academic / Project Query</option>
          <option value="rockstar">Jam Session / Music</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5"></textarea>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I accept the terms and conditions</label>
      </div>

      <button type="submit">Send Message</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 — Yachay Tech</p>
  </footer>
</body>
</html>
